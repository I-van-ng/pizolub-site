<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d82;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer border with rounded rect -->
  <rect x="15" y="10" width="370" height="100" rx="25" ry="25"
        fill="none" stroke="url(#borderGradient)" stroke-width="8"/>

  <!-- Main background -->
  <rect x="18" y="13" width="364" height="94" rx="22" ry="22"
        fill="#003d82"/>

  <!-- Water drop shape -->
  <g transform="translate(80, 55)">
    <!-- Teardrop/drop shape -->
    <path d="M 0 -20 C -12 0, -12 20, 0 30 C 12 20, 12 0, 0 -20 Z"
          fill="white" opacity="0.9"/>
  </g>

  <!-- Text "PizoLub" -->
  <text x="150" y="75" font-family="Arial, sans-serif" font-size="52" font-weight="bold"
        fill="white" letter-spacing="2">PizoLub</text>
</svg>
